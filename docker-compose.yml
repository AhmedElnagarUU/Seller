services:
  mongo:
    image: mongo:8.0.4
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
  # Local S3 stand-in for development, E2E and CI (Q-011: the MinIO images can no longer be pulled).
  # Production and staging use Cloudflare R2. The two buckets are created on start; the health check waits for them.
  s3:
    image: motoserver/moto:5.2.5
    entrypoint: ["sh", "-c"]
    command:
      - >
        moto_server -H 0.0.0.0 -p 9000 & pid=$$!;
        until python -c "import urllib.request as r; [r.urlopen(r.Request('http://localhost:9000/' + b, method='PUT')) for b in ('store-files', 'store-images')]";
        do sleep 1; done;
        wait $$pid
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://localhost:9000/store-images')"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mongo-data:
